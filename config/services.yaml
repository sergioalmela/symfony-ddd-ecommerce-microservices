# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        public: false       # Services are private by default

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/*/Domain/Entity/'
            - '../src/*/Domain/ValueObject/'
            - '../src/*/Domain/Event/'
    
    App\Order\Application\Query\GetOrders\GetOrdersQueryHandler:
        tags:
            - { name: messenger.message_handler, bus: query.bus }
            
    App\Order\Application\Query\GetOrderDetails\GetOrderDetailsQueryHandler:
        tags:
            - { name: messenger.message_handler, bus: query.bus }
                
    App\Order\Application\Command\CreateOrder\CreateOrderCommandHandler:
        arguments:
            $eventBus: '@app.order.outbox_event_bus'
        tags:
            - { name: messenger.message_handler, bus: command.bus }
                
    App\Order\Application\Command\UpdateOrderStatus\UpdateOrderStatusCommandHandler:
        arguments:
            $eventBus: '@app.order.outbox_event_bus'
        tags:
            - { name: messenger.message_handler, bus: command.bus }
                
    App\Invoice\Application\Command\UploadInvoice\UploadInvoiceCommandHandler:
        arguments:
            $eventBus: '@app.invoice.outbox_event_bus'
        tags:
            - { name: messenger.message_handler, bus: command.bus }
            
    App\Invoice\Application\Command\SendInvoice\SendInvoiceCommandHandler:
        arguments:
            $eventBus: '@app.invoice.outbox_event_bus'
        tags:
            - { name: messenger.message_handler, bus: command.bus }

    App\Invoice\Application\Command\RecordOrderShipment\RecordOrderShipmentCommandHandler:
        tags:
            - { name: messenger.message_handler, bus: command.bus }

    # === EVENT HANDLERS ===
    App\Invoice\Infrastructure\Listener\CreateOrderProjectionOnOrderCreated:
        tags:
            - { name: messenger.message_handler, bus: event.bus }
    App\Invoice\Infrastructure\Listener\SendInvoiceOnOrderShipped:
        tags:
            - { name: messenger.message_handler, bus: event.bus }
    App\Invoice\Infrastructure\Listener\SendInvoiceOnInvoiceUploaded:
        tags:
            - { name: messenger.message_handler, bus: event.bus }

    # === CONTROLLERS (must be public) ===
    App\Order\Infrastructure\Http\Controller\:
        resource: '../src/Order/Infrastructure/Http/Controller/'
        tags: ['controller.service_arguments']
        public: true
        
    App\Invoice\Infrastructure\Http\Controller\:
        resource: '../src/Invoice/Infrastructure/Http/Controller/'
        tags: ['controller.service_arguments']
        public: true

    # === REPOSITORY BINDINGS ===
    App\Order\Domain\Repository\OrderRepository:
        class: App\Order\Infrastructure\Persistence\Doctrine\Repository\DoctrineOrderRepository
        arguments:
            $entityManager: '@doctrine.orm.order_entity_manager'
        
    App\Invoice\Domain\Repository\InvoiceRepository:
        class: App\Invoice\Infrastructure\Persistence\Doctrine\Repository\DoctrineInvoiceRepository
        arguments:
            $entityManager: '@doctrine.orm.invoice_entity_manager'
            
    App\Invoice\Domain\Repository\OrderProjectionRepository:
        class: App\Invoice\Infrastructure\Persistence\Doctrine\Repository\DoctrineOrderProjectionRepository
        arguments:
            $entityManager: '@doctrine.orm.invoice_entity_manager'

    # === BUS BINDINGS ===
    # Each context records its events in the outbox of its own database.
    app.order.outbox_event_bus:
        class: App\Shared\Infrastructure\Bus\Event\DoctrineOutboxEventBus
        arguments:
            $connection: '@doctrine.dbal.order_connection'

    app.invoice.outbox_event_bus:
        class: App\Shared\Infrastructure\Bus\Event\DoctrineOutboxEventBus
        arguments:
            $connection: '@doctrine.dbal.invoice_connection'

    App\Shared\Infrastructure\Bus\Event\MessengerEventBus:
        arguments:
            $messageBus: '@event.bus'

    App\Shared\Infrastructure\Persistence\Doctrine\MigrationTablesSchemaFilter:
        arguments:
            $tableNames: ['doctrine_migration_versions_order', 'doctrine_migration_versions_invoice']
        tags:
            - { name: doctrine.dbal.schema_filter, connection: order }
            - { name: doctrine.dbal.schema_filter, connection: invoice }
            - { name: kernel.event_listener, event: console.command, method: onConsoleCommand }

    App\Shared\Domain\Service\StorageService:
        class: App\Shared\Infrastructure\Service\LocalStorageService
        arguments:
            $uploadDirectory: '%kernel.project_dir%/public/uploads'

    App\Shared\Infrastructure\Service\LocalStorageService:
        arguments:
            $uploadDirectory: '%kernel.project_dir%/public/uploads'
            
    App\Shared\Domain\Bus\Query\QueryBus:
        class: App\Shared\Infrastructure\Bus\Query\MessengerQueryBus
        arguments:
            $messageBus: '@query.bus'

    App\Shared\Infrastructure\Http\EventListener\ApiExceptionListener:
        arguments:
            $debug: '%kernel.debug%'
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException, priority: 100 }
