framework:
    messenger:
        default_bus: command.bus
        failure_transport: failed
        buses:
            command.bus:
                middleware:
                    - App\Shared\Infrastructure\Bus\TransactionalMessageMiddleware
            query.bus: ~
            event.bus:
                default_middleware:
                    allow_no_handlers: true

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    confirm_timeout: 5
            failed:
                dsn: '%env(MESSENGER_FAILURE_TRANSPORT_DSN)%'
                options:
                    confirm_timeout: 5
                    exchange:
                        name: failed
                    queues:
                        failed: ~
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            'App\Shared\Domain\Event\DomainEvent': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
