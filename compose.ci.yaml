# CI environment override
services:
  php:
    build:
      context: .
      target: frankenphp_dev
    environment:
      APP_ENV: test
      XDEBUG_MODE: "coverage"
    # Mount the checkout: .dockerignore keeps env files, tests and tool configs out of the image.
    volumes:
      - ./:/app
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
